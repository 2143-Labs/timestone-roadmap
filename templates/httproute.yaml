# Lives in `default` so the class-A gate filters resolve (Traefik ExtensionRef
# middlewares are namespace-local). The backend is in the release namespace,
# allowed by the ReferenceGrant next to this file.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.routeName }}
  namespace: default
  labels:
    # LAN clients resolve this host publicly (2143-Labs/argo docs/lan-dns.md):
    # no lan-dns zone covers b.hero.rehab, and lan-dns must not answer for it.
    k8s-gateway.dns/ignore: "true"
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: roadmap-b-hero-rehab-https
  hostnames:
    - "{{ .Values.host }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: public-inflight-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: timestone-roadmap
          namespace: {{ .Values.namespace }}
          port: 80
