# Exporter, builder and board wiring for the `refresh` sidecar, plus the baked
# snapshot (data/board.json) it starts from on an empty /data.
apiVersion: v1
kind: ConfigMap
metadata:
  name: timestone-roadmap-tools
  namespace: {{ .Values.namespace }}
  labels:
    app: timestone-roadmap
data:
  export_board.py: |
{{ .Files.Get "tools/export_board.py" | indent 4 }}
  build.py: |
{{ .Files.Get "tools/build.py" | indent 4 }}
  config.json: |
{{ .Values.config | default (.Files.Get "config/roadmap.json") | indent 4 }}
{{- if .Values.baked }}
  board.json: |
{{ .Files.Get "data/board.json" | indent 4 }}
{{- end }}
