# site/index.html is the baked page, generated by tools/build.py from
# config/roadmap.json and data/board.json. nginx serves it only until the
# `refresh` sidecar's first good build lands in /data (then again whenever /data is empty).
# With baked=false the ConfigMap renders empty: the pod starts, /index.html 404s
# from @baked, and readiness passes as soon as the first refresh writes /data.
apiVersion: v1
kind: ConfigMap
metadata:
  name: timestone-roadmap
  namespace: {{ .Values.namespace }}
  labels:
    app: timestone-roadmap
data:
{{- if .Values.baked }}
{{- range $path, $_ := .Files.Glob "site/*.html" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
