# Minimal config for a static page. The stock nginx-unprivileged config uses
# `worker_processes auto`, which on a many-core node spawns dozens of workers
# under a 100m CPU limit and makes readiness probes time out.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 15;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Live page written by the `refresh` sidecar into the shared emptyDir;
        # until its first good build, the baked copy from git serves.
        location = / { root /data; try_files /index.html @baked; }
        location = /index.html { root /data; try_files /index.html @baked; }
        location @baked { root /usr/share/nginx/html; try_files /index.html =404; }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
